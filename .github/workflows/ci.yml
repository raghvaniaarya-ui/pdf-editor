name: CI

on:
  push:
    branches: [main, develop]
    tags: ["v*"]
  pull_request:
    branches: [main]

env:
  # Qt must not try to open a display in CI.
  QT_QPA_PLATFORM: offscreen

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install Qt runtime libraries
        # PyQt6 needs the OpenGL / xcb libraries even for the offscreen
        # platform; without them importing PyQt6 fails.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1 libegl1 libxkbcommon-x11-0 libdbus-1-3 libglib2.0-0 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-render-util0 libxcb-xinerama0 libxcb-xfixes0 \
            libxcb-shape0 libxcb-randr0 libxcb-xkb1 libxcb-sync1 \
            libxcb-dri3-0 libxcb-present0 libxcb-dri2-0 libxcb-glx0 \
            libx11-xcb1 libxrender1 libxi6 libsm6 libice6

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run tests
        run: |
          pytest tests/ -v --cov=. --cov-report=xml --cov-report=term-missing

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        if: matrix.python-version == '3.11'
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install linting tools
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run ruff
        run: ruff check .

      - name: Run mypy
        run: mypy main.py --ignore-missing-imports

  build:
    runs-on: ${{ matrix.os }}
    needs: [test, lint]
    if: github.event_name == 'push'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: PDFEditor-windows
            output: dist/PDFEditor.exe
          - os: macos-latest
            artifact: PDFEditor-macos
            output: dist/PDFEditor
          - os: ubuntu-latest
            artifact: PDFEditor-linux
            output: dist/PDFEditor

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Linux Qt libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libegl1 libxkbcommon-x11-0 \
            libxcb-cursor0 libxcb-xinerama0 libdbus-1-3 libglib2.0-0

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build executable (PyInstaller spec)
        run: pyinstaller --noconfirm PDFEditor.spec

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.output }}
          retention-days: 7

  release:
    runs-on: ubuntu-latest
    needs: [build]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: PDFEditor-windows
          path: dist/windows/

      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: PDFEditor-macos
          path: dist/macos/

      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: PDFEditor-linux
          path: dist/linux/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/windows/PDFEditor.exe
            dist/macos/PDFEditor
            dist/linux/PDFEditor
          generate_release_notes: true
